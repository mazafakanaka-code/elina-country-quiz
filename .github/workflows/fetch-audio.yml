name: Vendor quiz audio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Roslyn
        run: |
          curl -L --fail --retry 3 -A "Mozilla/5.0" \
            "https://fine.sunproxy.net/file/UnBlZ3IzQXMxQXJVOFlPdHFyVXUvbmJzMXkrUnduZkxycktkUzdCck5jTGwwQWFPYlFPZjR3RGJoZ3FrYWV5NDZpNHZZSzJSWW1hZGRJUFAzdFFjRlRtMWhVeGFsUmRPOVREMU9yTFlSbU09/Bon_Iver_St._Vincent_-_Roslyn_%28Rilds.net%29.mp3" \
            -o music.mp3
          test -s music.mp3
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.mp3
          git diff --cached --quiet || git commit -m "Add quiz music"
          git push
